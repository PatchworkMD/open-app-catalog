name: Validate catalog

on:
  pull_request:
  push:
    branches: ['push/**']

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chromium-headless-shell
      TMPDIR: ${{ github.workspace }}/test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare test artifacts
        run: mkdir -p "$TMPDIR"
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium-headless-shell
      - name: Verify
        run: npm run verify
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-browser-evidence
          path: test-artifacts/hugging-app-evidence/
          if-no-files-found: warn
          retention-days: 14
