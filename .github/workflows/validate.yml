name: Validate catalog

on:
  pull_request:
  push:
    branches: ["push/**"]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chromium-headless-shell
      TMPDIR: ${{ github.workspace }}/test-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare test artifacts
        run: mkdir -p "$TMPDIR"
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium-headless-shell
      - name: Check JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/cloud-boards.mjs
          node --check worker/index.js
          for file in tests/*.cjs; do node --check "$file"; done
      - name: Check pipeline tests
        run: python3 -m unittest discover -s pipeline -p 'test_*.py'
      - name: Build reference pages
        run: python3 pipeline/build_search_pages.py
      - name: Check site and Worker tests
        run: node --test --test-concurrency=1 tests/*.test.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-browser-evidence
          path: |
            test-artifacts/hugging-app-qa-*/
            /tmp/hugging-app-*.png
            /tmp/hugging-elements-fixed.png
          if-no-files-found: warn
          retention-days: 14
