name: UI browser tests

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/site.test.cjs'
      - 'tests/browser-fixture.cjs'
      - '.github/workflows/ui-tests.yml'

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chrome
      - name: Run catalog browser checks
        env:
          TMPDIR: ${{ runner.temp }}
        run: node tests/site.test.cjs
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-browser-qa
          path: ${{ runner.temp }}/hugging-app-qa-*/*.png
          if-no-files-found: warn
          retention-days: 7
