name: UI browser tests

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/site.test.cjs'
      - 'tests/category.test.cjs'
      - 'tests/browser-fixture.cjs'
      - '.github/workflows/ui-tests.yml'

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chrome
      - name: Run catalog browser checks
        env:
          TMPDIR: ${{ runner.temp }}
        shell: bash
        run: |
          mkdir -p .omo/evidence
          node --check site/app.js
          node tests/category.test.cjs 2>&1 | tee .omo/evidence/category-ui-tests.log
          node tests/site.test.cjs 2>&1 | tee .omo/evidence/browser-tests.log
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-browser-qa
          path: .omo/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
