name: Update catalog

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh Apple catalog before deployment
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bc63168e55fcaa26c774d21c050704fa
      CATALOG_R2_UPLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Run fetch pipeline
        if: github.event_name == 'schedule' || inputs.refresh
        run: python3 pipeline/fetch.py

      - name: Commit refreshed catalog
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          git config user.name "open-app-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh catalog $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify production catalog
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          base = "https://catalog.patchworkmd.dev/"
          with urllib.request.urlopen(base + "data.json", timeout=20) as response:
              data = json.load(response)
          path = data["screens"][0]["path"]
          with urllib.request.urlopen(base + path, timeout=20) as response:
              if response.status != 200:
                  raise RuntimeError(f"media check returned {response.status}")
          print("production catalog and representative media OK")
          PY
