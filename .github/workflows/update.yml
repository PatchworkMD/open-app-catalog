name: Update catalog

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fetch pipeline
        run: python3 pipeline/fetch.py

      - name: Commit refreshed catalog
        run: |
          git config user.name "open-app-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/assets
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh catalog $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
