name: Update catalog

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/update.yml"
      - "pipeline/**"
      - "site/**"
      - "!site/data.json"
      - "!site/curation.json"
      - "worker/**"
      - "wrangler.jsonc"
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh Apple catalog before deployment
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bc63168e55fcaa26c774d21c050704fa
      CATALOG_R2_UPLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check pipeline and site syntax
        run: |
          node --check site/app.js
          node --check site/cloud-boards.mjs
          node --check tests/accounts.test.cjs


      - name: Check Cloudflare credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Run fetch pipeline
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python3 pipeline/fetch.py

      - name: Reconcile current snapshot curation
        run: python3 pipeline/fetch.py --reconcile-only

      - name: Check pipeline tests
        run: python3 -m unittest discover -s pipeline -p 'test_*.py'

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock playwright@1.63.0

      - name: Check site tests
        run: node --test tests/*.test.cjs

      - name: Commit refreshed catalog
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          git config user.name "open-app-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/curation.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh catalog $(date -u +%Y-%m-%d)"
          git push

      - name: Build crawlable reference pages
        run: python3 pipeline/build_search_pages.py
      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify deployed catalog through Worker origin
        run: python3 pipeline/verify_deployment.py
