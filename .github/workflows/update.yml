name: Update catalog

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update.yml'
      - 'pipeline/**'
      - 'site/**'
      - '!site/data.json'
      - '!site/curation.json'
      - 'worker/**'
      - 'wrangler.jsonc'
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: Refresh Apple catalog before deployment
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CATALOG_R2_UPLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check pipeline and site syntax
        run: npm run check:syntax

      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4

      - name: Run fetch pipeline
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
        run: python3 pipeline/fetch.py

      - name: Reconcile current snapshot curation
        run: python3 pipeline/fetch.py --reconcile-only

      - name: Check pipeline tests
        run: npm run test:pipeline

      - name: Install browser
        run: npx playwright install --with-deps chromium-headless-shell

      - name: Check site tests
        run: npm run test:site
        env:
          PLAYWRIGHT_CHANNEL: chromium-headless-shell

      - name: Commit refreshed catalog
        if: github.event_name == 'schedule' || inputs.refresh
        run: |
          git config user.name "open-app-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/curation.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh catalog $(date -u +%Y-%m-%d)"
          git push

      - name: Build crawlable reference pages
        run: python3 pipeline/build_search_pages.py
      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Verify deployed catalog through Worker origin
        run: python3 pipeline/verify_deployment.py
