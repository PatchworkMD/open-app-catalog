name: Verify catalog

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "pipeline/**"
      - "site/**"
      - "tests/**"
      - "worker/**"
      - "firebase.json"
      - "firestore.rules"
      - "wrangler.jsonc"
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "pipeline/**"
      - "site/**"
      - "tests/**"
      - "worker/**"
      - "firebase.json"
      - "firestore.rules"
      - "wrangler.jsonc"

permissions:
  contents: read

concurrency:
  group: verify-catalog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Install browser and build dependencies
        run: |
          npm install --no-save --no-package-lock firebase@12.19.0 @firebase/rules-unit-testing@5.0.2 firebase-tools@15.31.0 esbuild@0.25.9 wrangler@4 playwright@1
          npx playwright install --with-deps chromium
      - name: Test Firestore rules in a demo-project emulator
        run: npx firebase-tools emulators:exec --only firestore --project demo-hugging-app-rules "node --test tests/firestore-rules.test.mjs"
      - name: Test catalog pipeline
        run: python3 -m unittest discover -s pipeline -p 'test_*.py'
      - name: Test board model and browser flows
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          node tests/board-model.test.cjs
          node tests/site.test.cjs
      - name: Check JavaScript and Firebase configuration
        run: |
          node --check site/app.js
          node --check site/board-model.js
          node --input-type=module --check < site/account-sync.js
          python3 -m json.tool .firebaserc > /dev/null
          python3 -m json.tool firebase.json > /dev/null
          python3 -m json.tool site/firebase-config.json > /dev/null
      - name: Build Firebase client and dry-run Worker
        run: |
          npx esbuild site/firebase-client.entry.js --bundle --platform=browser --format=esm --outfile=/tmp/firebase-client.bundle.js
          npx wrangler deploy --dry-run
