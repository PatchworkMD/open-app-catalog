name: Verify catalog pipeline

on:
  pull_request:
    paths:
      - ".github/workflows/verify-pipeline.yml"
      - "pipeline/**"
      - "site/data.json"
      - "site/curation.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test catalog pipeline
        run: python3 -m unittest discover -s pipeline -p 'test_*.py'
